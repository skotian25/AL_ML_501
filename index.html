:root{
  --bg:#F4F7F9; --surface:#FFFFFF; --ink:#1B222B; --muted:#5A6472; --line:#D9E1E8;
  --navy:#21295C; --sup:#065A82; --sup-bg:#E3F1F7; --uns:#B4540A; --uns-bg:#FCEBDD;
  --both:#5B3FA0; --both-bg:#ECE6F7;
  --tab:#2F855A; --cv:#B83280; --nlp:#2B6CB0; --gen:#9C4221;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151C; --surface:#18202A; --ink:#E8EDF2; --muted:#A3AFBD; --line:#2C3846;
    --navy:#9FD3E8; --sup:#7CC6E6; --sup-bg:#16303D; --uns:#F2A56A; --uns-bg:#3A2616;
    --both:#B9A4EE; --both-bg:#2A2144;
    --tab:#68D391; --cv:#F687B3; --nlp:#90CDF4; --gen:#F6AD7B;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:&quot;Segoe UI&quot;,Calibri,Arial,sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,#21295C,#065A82);color:#fff;padding:48px 24px 40px;text-align:center}
header h1{margin:0 0 8px;font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:-.5px}
header p{margin:0 auto;max-width:720px;font-size:1.05rem;opacity:.92}
header .by{margin-top:14px;font-size:.9rem;opacity:.75}
main{max-width:1180px;margin:0 auto;padding:28px 20px 56px}
h2{color:var(--navy);font-size:1.5rem;margin:44px 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 6px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:.88rem;font-weight:600;border:1.5px solid}
.pill i{width:10px;height:10px;border-radius:50%;background:currentColor;display:inline-block}
.p-sup{color:var(--sup);background:var(--sup-bg);border-color:var(--sup)}
.p-uns{color:var(--uns);background:var(--uns-bg);border-color:var(--uns)}
.p-both{color:var(--both);background:var(--both-bg);border-color:var(--both)}

/* family tree */
.tree{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.tree-root{text-align:center;font-weight:700;color:#fff;background:var(--navy);display:table;margin:0 auto 6px;padding:8px 22px;border-radius:10px}
@media (prefers-color-scheme: dark){.tree-root{color:#10151C}}
.stem{width:2px;height:16px;background:var(--line);margin:0 auto}
.branches{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
@media(max-width:820px){.branches{grid-template-columns:1fr}}
.branch{border:2px solid;border-radius:12px;padding:14px}
.branch.sup{border-color:var(--sup);background:var(--sup-bg)}
.branch.uns{border-color:var(--uns);background:var(--uns-bg)}
.branch h3{margin:0 0 4px;font-size:1.05rem}
.branch.sup h3{color:var(--sup)} .branch.uns h3{color:var(--uns)}
.branch .why{font-size:.85rem;color:var(--muted);margin:0 0 10px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.group h4{margin:0 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.chip{display:inline-block;margin:2px 3px 2px 0;padding:3px 10px;border-radius:8px;font-size:.82rem;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.chip.ens{border-style:dashed}
.chip.hyb{border-color:var(--both);color:var(--both)}
.note{font-size:.82rem;color:var(--muted);margin:10px 0 0}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.filters button{font:inherit;font-size:.88rem;font-weight:600;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.filters button:hover{border-color:var(--sup)}
.filters button[aria-pressed=&quot;true&quot;]{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme: dark){.filters button[aria-pressed=&quot;true&quot;]{color:#10151C}}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-top:6px solid;border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.card.sup{border-top-color:var(--sup)} .card.uns{border-top-color:var(--uns)} .card.both{border-top-color:var(--both)}
.card[hidden]{display:none}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.num{font-size:.8rem;font-weight:700;color:var(--muted)}
.card h3{margin:2px 0 0;font-size:1.2rem;color:var(--ink)}
.type{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.card.sup .type{color:var(--sup);background:var(--sup-bg)}
.card.uns .type{color:var(--uns);background:var(--uns-bg)}
.card.both .type{color:var(--both);background:var(--both-bg)}
.doms{display:flex;flex-wrap:wrap;gap:6px}
.dom{font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:6px;color:#fff}
.d-tab{background:#2F855A}.d-cv{background:#B83280}.d-nlp{background:#2B6CB0}.d-gen{background:#9C4221}
@media (prefers-color-scheme: dark){.dom{color:#10151C}.d-tab{background:#68D391}.d-cv{background:#F687B3}.d-nlp{background:#90CDF4}.d-gen{background:#F6AD7B}}
.lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 2px}
.card p{margin:0;font-size:.93rem}
.card ul{margin:0;padding-left:18px;font-size:.93rem}

/* matrix */
.wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 14px;text-align:center;border-bottom:1px solid var(--line);font-size:.92rem}
th{background:var(--bg);color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.6px}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:none}
td:first-child{font-weight:600}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%}
.dt{background:#2F855A}.dc{background:#B83280}.dn{background:#2B6CB0}.dg{background:#9C4221}
@media (prefers-color-scheme: dark){.dt{background:#68D391}.dc{background:#F687B3}.dn{background:#90CDF4}.dg{background:#F6AD7B}}
.tag{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px}
.tag.sup{color:var(--sup);background:var(--sup-bg)}.tag.uns{color:var(--uns);background:var(--uns-bg)}.tag.both{color:var(--both);background:var(--both-bg)}

.takeaways{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.take{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sup);border-radius:10px;padding:14px 16px;font-size:.93rem}
.take b{display:block;margin-bottom:2px;color:var(--navy)}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:0 20px 36px}
@media print{header{background:#21295C!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.filters{display:none}.card{break-inside:avoid}}

&lt;body&gt;
&lt;header&gt;
  &lt;h1&gt;Machine Learning Algorithms: A Visual Framework&lt;/h1&gt;
  &lt;p&gt;Ten core algorithms, classified by how they learn, where they are used, and what they do in the real world.&lt;/p&gt;
  &lt;div class=&quot;by&quot;&gt;Portfolio artifact &amp;middot; Shreyas Kotian&lt;/div&gt;
&lt;/header&gt;

&lt;main&gt;
  &lt;h2&gt;How to read this framework&lt;/h2&gt;
  &lt;p class=&quot;sub&quot;&gt;Every algorithm is color-coded by learning type and tagged with its application domains.&lt;/p&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span class=&quot;pill p-sup&quot;&gt;&lt;i&gt;&lt;/i&gt;Supervised: learns from labeled examples&lt;/span&gt;
    &lt;span class=&quot;pill p-uns&quot;&gt;&lt;i&gt;&lt;/i&gt;Unsupervised: finds structure without labels&lt;/span&gt;
    &lt;span class=&quot;pill p-both&quot;&gt;&lt;i&gt;&lt;/i&gt;Hybrid: unsupervised pretraining, then supervised tuning&lt;/span&gt;
  &lt;/div&gt;

  &lt;h2&gt;How the algorithms relate&lt;/h2&gt;
  &lt;p class=&quot;sub&quot;&gt;The family tree shows which algorithms share a learning approach and which build on one another.&lt;/p&gt;
  &lt;div class=&quot;tree&quot; role=&quot;img&quot; aria-label=&quot;Family tree of the ten algorithms grouped under supervised and unsupervised learning&quot;&gt;
    &lt;div class=&quot;tree-root&quot;&gt;Machine Learning&lt;/div&gt;
    &lt;div class=&quot;stem&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;branches&quot;&gt;
      &lt;div class=&quot;branch sup&quot;&gt;
        &lt;h3&gt;Supervised Learning&lt;/h3&gt;
        &lt;p class=&quot;why&quot;&gt;Training data includes the correct answer, so the model learns to predict it.&lt;/p&gt;
        &lt;div class=&quot;groups&quot;&gt;
          &lt;div class=&quot;group&quot;&gt;&lt;h4&gt;Linear &amp;amp; margin-based&lt;/h4&gt;
            &lt;span class=&quot;chip&quot;&gt;Linear / Logistic Regression&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Support Vector Machine&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;group&quot;&gt;&lt;h4&gt;Tree-based&lt;/h4&gt;
            &lt;span class=&quot;chip&quot;&gt;Decision Tree&lt;/span&gt;&lt;span class=&quot;chip ens&quot;&gt;Random Forest&lt;/span&gt;&lt;span class=&quot;chip ens&quot;&gt;Gradient Boosting&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;group&quot;&gt;&lt;h4&gt;Deep learning&lt;/h4&gt;
            &lt;span class=&quot;chip&quot;&gt;CNN&lt;/span&gt;&lt;span class=&quot;chip hyb&quot;&gt;Transformer (fine-tuned)&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;note&quot;&gt;Dashed outlines mark ensembles: many Decision Trees combined into one stronger model.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;branch uns&quot;&gt;
        &lt;h3&gt;Unsupervised Learning&lt;/h3&gt;
        &lt;p class=&quot;why&quot;&gt;No answers given. The model discovers patterns on its own.&lt;/p&gt;
        &lt;div class=&quot;groups&quot;&gt;
          &lt;div class=&quot;group&quot;&gt;&lt;h4&gt;Clustering&lt;/h4&gt;&lt;span class=&quot;chip&quot;&gt;K-Means&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;group&quot;&gt;&lt;h4&gt;Dimensionality reduction&lt;/h4&gt;&lt;span class=&quot;chip&quot;&gt;PCA&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;group&quot;&gt;&lt;h4&gt;Generative&lt;/h4&gt;&lt;span class=&quot;chip&quot;&gt;Diffusion Model&lt;/span&gt;&lt;span class=&quot;chip hyb&quot;&gt;Transformer (pretraining)&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;note&quot;&gt;The Transformer appears in both branches: it pretrains without labels, then is fine-tuned with them.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h2&gt;The ten algorithms&lt;/h2&gt;
  &lt;p class=&quot;sub&quot;&gt;Filter by learning type or application domain.&lt;/p&gt;
  &lt;div class=&quot;filters&quot; role=&quot;group&quot; aria-label=&quot;Filter algorithms&quot;&gt;
    &lt;button type=&quot;button&quot; data-f=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;All 10&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-f=&quot;sup&quot; aria-pressed=&quot;false&quot;&gt;Supervised&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-f=&quot;uns&quot; aria-pressed=&quot;false&quot;&gt;Unsupervised&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-f=&quot;tab&quot; aria-pressed=&quot;false&quot;&gt;Tabular Data&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-f=&quot;cv&quot; aria-pressed=&quot;false&quot;&gt;Computer Vision&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-f=&quot;nlp&quot; aria-pressed=&quot;false&quot;&gt;NLP&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-f=&quot;gen&quot; aria-pressed=&quot;false&quot;&gt;Generative AI&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid&quot; id=&quot;grid&quot;&gt;

    &lt;article class=&quot;card sup&quot; data-t=&quot;sup&quot; data-d=&quot;tab&quot;&gt;
      &lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;span class=&quot;num&quot;&gt;01&lt;/span&gt;&lt;h3&gt;Linear &amp;amp; Logistic Regression&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;type&quot;&gt;Supervised&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;doms&quot;&gt;&lt;span class=&quot;dom d-tab&quot;&gt;Tabular Data&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;How it works&lt;/p&gt;&lt;p&gt;Fits a straight line (or an S-shaped curve for logistic regression) between the input features and an outcome by finding the weights that minimize prediction error.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;Real-world use cases&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Predicting house prices&lt;/li&gt;&lt;li&gt;Flagging customers likely to cancel a subscription&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;card sup&quot; data-t=&quot;sup&quot; data-d=&quot;tab&quot;&gt;
      &lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;span class=&quot;num&quot;&gt;02&lt;/span&gt;&lt;h3&gt;Decision Tree&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;type&quot;&gt;Supervised&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;doms&quot;&gt;&lt;span class=&quot;dom d-tab&quot;&gt;Tabular Data&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;How it works&lt;/p&gt;&lt;p&gt;Asks a sequence of yes/no questions about the features, each chosen to split the data into purer groups, until every leaf gives a prediction.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;Real-world use cases&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Loan approval decisions&lt;/li&gt;&lt;li&gt;Sorting fruit by weight, size, and color&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;card sup&quot; data-t=&quot;sup&quot; data-d=&quot;tab&quot;&gt;
      &lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;span class=&quot;num&quot;&gt;03&lt;/span&gt;&lt;h3&gt;Random Forest&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;type&quot;&gt;Supervised&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;doms&quot;&gt;&lt;span class=&quot;dom d-tab&quot;&gt;Tabular Data&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;How it works&lt;/p&gt;&lt;p&gt;Trains many decision trees on random samples of the data and features, then combines their votes so individual errors cancel out.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;Real-world use cases&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Credit card fraud detection&lt;/li&gt;&lt;li&gt;Predicting equipment failure&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;card sup&quot; data-t=&quot;sup&quot; data-d=&quot;tab&quot;&gt;
      &lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;span class=&quot;num&quot;&gt;04&lt;/span&gt;&lt;h3&gt;Gradient Boosting (XGBoost)&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;type&quot;&gt;Supervised&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;doms&quot;&gt;&lt;span class=&quot;dom d-tab&quot;&gt;Tabular Data&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;How it works&lt;/p&gt;&lt;p&gt;Builds trees one after another, with each new tree trained to correct the mistakes of the trees before it.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;Real-world use cases&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Credit scoring&lt;/li&gt;&lt;li&gt;Retail demand forecasting&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;card sup&quot; data-t=&quot;sup&quot; data-d=&quot;tab nlp&quot;&gt;
      &lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;span class=&quot;num&quot;&gt;05&lt;/span&gt;&lt;h3&gt;Support Vector Machine&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;type&quot;&gt;Supervised&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;doms&quot;&gt;&lt;span class=&quot;dom d-tab&quot;&gt;Tabular Data&lt;/span&gt;&lt;span class=&quot;dom d-nlp&quot;&gt;NLP&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;How it works&lt;/p&gt;&lt;p&gt;Finds the boundary that separates classes with the widest possible margin. Kernel functions let it draw curved boundaries for harder problems.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;Real-world use cases&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Spam email filtering&lt;/li&gt;&lt;li&gt;Categorizing support tickets by topic&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;card uns&quot; data-t=&quot;uns&quot; data-d=&quot;tab&quot;&gt;
      &lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;span class=&quot;num&quot;&gt;06&lt;/span&gt;&lt;h3&gt;K-Means Clustering&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;type&quot;&gt;Unsupervised&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;doms&quot;&gt;&lt;span class=&quot;dom d-tab&quot;&gt;Tabular Data&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;How it works&lt;/p&gt;&lt;p&gt;Picks k cluster centers, assigns each data point to its nearest center, then moves each center to the average of its points. It repeats until the groups stop changing.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;Real-world use cases&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Customer segmentation for marketing&lt;/li&gt;&lt;li&gt;Grouping similar products&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;card uns&quot; data-t=&quot;uns&quot; data-d=&quot;tab cv&quot;&gt;
      &lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;span class=&quot;num&quot;&gt;07&lt;/span&gt;&lt;h3&gt;Principal Component Analysis (PCA)&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;type&quot;&gt;Unsupervised&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;doms&quot;&gt;&lt;span class=&quot;dom d-tab&quot;&gt;Tabular Data&lt;/span&gt;&lt;span class=&quot;dom d-cv&quot;&gt;Computer Vision&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;How it works&lt;/p&gt;&lt;p&gt;Finds new axes that capture the most variation in the data, so many features can be reduced to a few with little information lost.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;Real-world use cases&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Compressing sensor data&lt;/li&gt;&lt;li&gt;Visualizing high-dimensional data and compressing face images&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;card sup&quot; data-t=&quot;sup&quot; data-d=&quot;cv&quot;&gt;
      &lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;span class=&quot;num&quot;&gt;08&lt;/span&gt;&lt;h3&gt;Convolutional Neural Network (CNN)&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;type&quot;&gt;Supervised&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;doms&quot;&gt;&lt;span class=&quot;dom d-cv&quot;&gt;Computer Vision&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;How it works&lt;/p&gt;&lt;p&gt;Slides small learned filters across an image to detect edges, then textures, then shapes. Stacked layers build up from simple patterns to full object recognition.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;Real-world use cases&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Detecting defects on a production line&lt;/li&gt;&lt;li&gt;Reading medical scans&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;card both&quot; data-t=&quot;sup uns&quot; data-d=&quot;nlp gen&quot;&gt;
      &lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;span class=&quot;num&quot;&gt;09&lt;/span&gt;&lt;h3&gt;Transformer (Large Language Model)&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;type&quot;&gt;Hybrid&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;doms&quot;&gt;&lt;span class=&quot;dom d-nlp&quot;&gt;NLP&lt;/span&gt;&lt;span class=&quot;dom d-gen&quot;&gt;Generative AI&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;How it works&lt;/p&gt;&lt;p&gt;Uses attention to weigh how every word relates to every other word. It is pretrained without labels to predict the next word, then fine-tuned with labeled examples for specific tasks.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;Real-world use cases&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Chatbots and virtual assistants&lt;/li&gt;&lt;li&gt;Translation, summarization, and code generation&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;card uns&quot; data-t=&quot;uns&quot; data-d=&quot;cv gen&quot;&gt;
      &lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;span class=&quot;num&quot;&gt;10&lt;/span&gt;&lt;h3&gt;Diffusion Model&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;type&quot;&gt;Unsupervised&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;doms&quot;&gt;&lt;span class=&quot;dom d-cv&quot;&gt;Computer Vision&lt;/span&gt;&lt;span class=&quot;dom d-gen&quot;&gt;Generative AI&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;How it works&lt;/p&gt;&lt;p&gt;Learns to remove noise from images step by step. To create something new, it starts from pure noise and repeatedly denoises it into a finished image.&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p class=&quot;lbl&quot;&gt;Real-world use cases&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Text-to-image generation&lt;/li&gt;&lt;li&gt;Creating synthetic training data and restoring damaged photos&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/article&gt;

  &lt;/div&gt;

  &lt;h2&gt;Domain coverage at a glance&lt;/h2&gt;
  &lt;p class=&quot;sub&quot;&gt;Which algorithms apply to which data types. Tree-based methods dominate tabular data, while deep learning takes over for images, text, and generation.&lt;/p&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Algorithm&lt;/th&gt;&lt;th&gt;Learning type&lt;/th&gt;&lt;th&gt;Tabular&lt;/th&gt;&lt;th&gt;Vision&lt;/th&gt;&lt;th&gt;NLP&lt;/th&gt;&lt;th&gt;Gen AI&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Linear / Logistic Regression&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag sup&quot;&gt;Supervised&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dt&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Decision Tree&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag sup&quot;&gt;Supervised&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dt&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Random Forest&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag sup&quot;&gt;Supervised&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dt&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Gradient Boosting&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag sup&quot;&gt;Supervised&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dt&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Support Vector Machine&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag sup&quot;&gt;Supervised&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dt&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dn&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;K-Means Clustering&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag uns&quot;&gt;Unsupervised&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dt&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;PCA&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag uns&quot;&gt;Unsupervised&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dt&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dc&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;CNN&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag sup&quot;&gt;Supervised&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dc&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Transformer (LLM)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag both&quot;&gt;Hybrid&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dn&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dg&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Diffusion Model&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag uns&quot;&gt;Unsupervised&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dc&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dot dg&quot; role=&quot;img&quot; aria-label=&quot;Yes&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;h2&gt;Key takeaways&lt;/h2&gt;
  &lt;div class=&quot;takeaways&quot;&gt;
    &lt;div class=&quot;take&quot;&gt;&lt;b&gt;Match the method to the data&lt;/b&gt;Spreadsheet-style data favors trees and regression. Images favor CNNs. Language and generation favor Transformers and diffusion models.&lt;/div&gt;
    &lt;div class=&quot;take&quot;&gt;&lt;b&gt;Labels decide the learning type&lt;/b&gt;If you have known answers, use supervised learning. If you only want to discover groups or compress data, use unsupervised learning.&lt;/div&gt;
    &lt;div class=&quot;take&quot;&gt;&lt;b&gt;Simple often wins&lt;/b&gt;Interpretable models like regression and decision trees remain the right choice when explaining a decision matters as much as accuracy.&lt;/div&gt;
    &lt;div class=&quot;take&quot;&gt;&lt;b&gt;Ensembles build on trees&lt;/b&gt;Random Forest and Gradient Boosting combine many Decision Trees, trading some interpretability for much higher accuracy.&lt;/div&gt;
  &lt;/div&gt;
&lt;/main&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;header&gt;&lt;strong&gt;NEURAL NETWORK FUNDAMENTALS&lt;/strong&gt;&lt;small&gt;Interactive presentation · Shreyas Kotian&lt;/small&gt;&lt;/header&gt;&lt;main&gt;
&lt;section class=&quot;slide active&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Neural network fundamentals&lt;/div&gt;&lt;h1&gt;Inside a&lt;br&gt;Neural Network&lt;/h1&gt;&lt;p class=&quot;subtitle&quot;&gt;Layers, neurons, weights, activation functions, loss, and optimization — explored with TensorFlow Playground.&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;From inputs to predictions:&lt;/strong&gt; how simple computational units learn complex patterns.&lt;/div&gt;&lt;p style=&quot;margin-top:80px;color:var(--blue);font-weight:700&quot;&gt;Shreyas Kotian&lt;/p&gt;&lt;div class=&quot;footer&quot;&gt;&lt;span&gt;Neural Network Components&lt;/span&gt;&lt;span&gt;01 / 10&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;slide&quot;&gt;&lt;h2&gt;The Big Picture&lt;/h2&gt;&lt;p class=&quot;subtitle&quot;&gt;A neural network learns patterns by adjusting numbers, step by step, to reduce its mistakes.&lt;/p&gt;&lt;p&gt;A neural network is a stack of simple calculating units called &lt;strong&gt;neurons&lt;/strong&gt;, arranged in &lt;strong&gt;layers&lt;/strong&gt;. Data goes in, passes through the layers, and a prediction comes out. Training compares predictions with correct answers and adjusts the network’s internal numbers.&lt;/p&gt;&lt;div class=&quot;grid two&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;span class=&quot;number&quot;&gt;01&lt;/span&gt;&lt;h3&gt;Layers&lt;/h3&gt;How neurons are organized&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;span class=&quot;number&quot;&gt;02&lt;/span&gt;&lt;h3&gt;Neurons&lt;/h3&gt;Units that compute and pass on a value&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;span class=&quot;number&quot;&gt;03&lt;/span&gt;&lt;h3&gt;Weights&lt;/h3&gt;The learned strength of each connection&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;span class=&quot;number&quot;&gt;04&lt;/span&gt;&lt;h3&gt;Activation functions&lt;/h3&gt;Let the network learn curves, not just lines&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;span class=&quot;number&quot;&gt;05&lt;/span&gt;&lt;h3&gt;Loss functions&lt;/h3&gt;Measure how wrong a prediction is&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;span class=&quot;number&quot;&gt;06&lt;/span&gt;&lt;h3&gt;Optimization algorithms&lt;/h3&gt;Adjust weights to reduce loss&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;footer&quot;&gt;&lt;span&gt;Neural Network Components&lt;/span&gt;&lt;span&gt;02 / 10&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;slide&quot;&gt;&lt;h2&gt;Structure: How Data Flows Through the Network&lt;/h2&gt;&lt;p class=&quot;subtitle&quot;&gt;Input layer → Hidden layer 1 → Hidden layer 2 → Output layer&lt;/p&gt;&lt;svg class=&quot;diagram&quot; viewBox=&quot;0 0 950 380&quot; role=&quot;img&quot; aria-label=&quot;Fully connected neural network with three inputs, two hidden layers of four neurons, and one output&quot;&gt;&lt;g id=&quot;network&quot;&gt;&lt;/g&gt;&lt;/svg&gt;&lt;div class=&quot;grid four&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;strong&gt;Input&lt;/strong&gt;&lt;p&gt;Features enter (x₁, x₂, x₃)&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;strong&gt;Hidden layer 1&lt;/strong&gt;&lt;p&gt;Detects simple patterns&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;strong&gt;Hidden layer 2&lt;/strong&gt;&lt;p&gt;Combines complex patterns&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;strong&gt;Output&lt;/strong&gt;&lt;p&gt;Produces prediction&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;footer&quot;&gt;&lt;span&gt;Neural Network Components&lt;/span&gt;&lt;span&gt;03 / 10&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;slide&quot;&gt;&lt;h2&gt;Layers and Neurons&lt;/h2&gt;&lt;p class=&quot;subtitle&quot;&gt;The building blocks of the architecture&lt;/p&gt;&lt;div class=&quot;grid two&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;Layers&lt;/h3&gt;&lt;div class=&quot;label&quot;&gt;What it is&lt;/div&gt;&lt;p&gt;A group of neurons at the same depth in a network. Networks have input and output layers and may have one or more hidden layers.&lt;/p&gt;&lt;div class=&quot;label&quot;&gt;Role&lt;/div&gt;&lt;p&gt;Inputs receive features, hidden layers transform them, and the output layer makes the final prediction. More layers can learn more abstract patterns.&lt;/p&gt;&lt;div class=&quot;label&quot;&gt;In the Playground&lt;/div&gt;&lt;p&gt;Use + and − to add or remove hidden layers.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;Neurons&lt;/h3&gt;&lt;div class=&quot;label&quot;&gt;What it is&lt;/div&gt;&lt;p&gt;A small computing unit: multiply inputs by weights, add a bias, and apply an activation function.&lt;/p&gt;&lt;div class=&quot;label&quot;&gt;Role&lt;/div&gt;&lt;p&gt;Each neuron detects a small pattern; its output becomes an input to the next layer.&lt;/p&gt;&lt;div class=&quot;label&quot;&gt;In the Playground&lt;/div&gt;&lt;p&gt;Each square is a neuron. Hover to inspect the pattern it has learned.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;footer&quot;&gt;&lt;span&gt;Neural Network Components&lt;/span&gt;&lt;span&gt;04 / 10&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;slide&quot;&gt;&lt;h2&gt;Weights&lt;/h2&gt;&lt;p class=&quot;subtitle&quot;&gt;The learned strength of every connection&lt;/p&gt;&lt;div class=&quot;grid two&quot;&gt;&lt;div&gt;&lt;div class=&quot;label&quot;&gt;What it is&lt;/div&gt;&lt;p&gt;A number attached to a connection between neurons. A large positive weight increases influence; a negative weight decreases it; a weight near zero means the input has little influence.&lt;/p&gt;&lt;div class=&quot;label&quot;&gt;Role&lt;/div&gt;&lt;p&gt;Training repeatedly adjusts weights so predictions better match correct answers. A &lt;strong&gt;bias&lt;/strong&gt; is another learned parameter that shifts a neuron's response.&lt;/p&gt;&lt;div class=&quot;label&quot;&gt;In the Playground&lt;/div&gt;&lt;p&gt;Thicker lines mean stronger connections. Blue indicates positive weights; orange indicates negative weights.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;formula&quot;&gt;y = f(w₁x₁ + w₂x₂ + w₃x₃ + b)&lt;/div&gt;&lt;svg viewBox=&quot;0 0 400 220&quot; style=&quot;width:100%&quot; aria-label=&quot;Weighted inputs entering a neuron&quot;&gt;&lt;g stroke=&quot;#b3c5d6&quot; stroke-width=&quot;3&quot;&gt;&lt;line x1=&quot;70&quot; y1=&quot;35&quot; x2=&quot;230&quot; y2=&quot;110&quot;/&gt;&lt;line x1=&quot;70&quot; y1=&quot;110&quot; x2=&quot;230&quot; y2=&quot;110&quot;/&gt;&lt;line x1=&quot;70&quot; y1=&quot;185&quot; x2=&quot;230&quot; y2=&quot;110&quot;/&gt;&lt;line x1=&quot;250&quot; y1=&quot;110&quot; x2=&quot;350&quot; y2=&quot;110&quot;/&gt;&lt;/g&gt;&lt;g fill=&quot;#08638c&quot;&gt;&lt;circle cx=&quot;70&quot; cy=&quot;35&quot; r=&quot;23&quot;/&gt;&lt;circle cx=&quot;70&quot; cy=&quot;110&quot; r=&quot;23&quot;/&gt;&lt;circle cx=&quot;70&quot; cy=&quot;185&quot; r=&quot;23&quot;/&gt;&lt;circle cx=&quot;240&quot; cy=&quot;110&quot; r=&quot;29&quot;/&gt;&lt;/g&gt;&lt;g font-size=&quot;16&quot; fill=&quot;white&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;70&quot; y=&quot;41&quot;&gt;x₁&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;116&quot;&gt;x₂&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;191&quot;&gt;x₃&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;116&quot;&gt;Σ+b&lt;/text&gt;&lt;/g&gt;&lt;text x=&quot;355&quot; y=&quot;115&quot; font-size=&quot;20&quot;&gt;y&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;footer&quot;&gt;&lt;span&gt;Neural Network Components&lt;/span&gt;&lt;span&gt;05 / 10&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;slide&quot;&gt;&lt;h2&gt;Activation Functions&lt;/h2&gt;&lt;p class=&quot;subtitle&quot;&gt;Decide whether, and how strongly, a neuron passes its signal on&lt;/p&gt;&lt;div class=&quot;grid four&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;ReLU&lt;/h3&gt;&lt;div class=&quot;formula&quot;&gt;max(0, x)&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Output:&lt;/strong&gt; 0 and up&lt;/p&gt;&lt;p&gt;Passes positives, blocks negatives. Common in hidden layers.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;Tanh&lt;/h3&gt;&lt;div class=&quot;formula&quot;&gt;tanh(x)&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Output:&lt;/strong&gt; −1 to 1&lt;/p&gt;&lt;p&gt;A smooth S-curve centered on zero.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;Sigmoid&lt;/h3&gt;&lt;div class=&quot;formula&quot;&gt;1/(1+e⁻ˣ)&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Output:&lt;/strong&gt; 0 to 1&lt;/p&gt;&lt;p&gt;An S-curve useful for probability-like outputs.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;Linear&lt;/h3&gt;&lt;div class=&quot;formula&quot;&gt;f(x) = x&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Output:&lt;/strong&gt; any value&lt;/p&gt;&lt;p&gt;No nonlinearity; stacked linear layers remain linear.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; Without nonlinear activations, stacking layers still gives a linear model. Nonlinearity enables curved and complex decision boundaries.&lt;/div&gt;&lt;div class=&quot;footer&quot;&gt;&lt;span&gt;Neural Network Components&lt;/span&gt;&lt;span&gt;06 / 10&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;slide&quot;&gt;&lt;h2&gt;Loss Functions and Optimization Algorithms&lt;/h2&gt;&lt;p class=&quot;subtitle&quot;&gt;How the network measures its error and how it improves&lt;/p&gt;&lt;div class=&quot;grid two&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;Loss function&lt;/h3&gt;&lt;div class=&quot;label&quot;&gt;What it is&lt;/div&gt;&lt;p&gt;A formula that turns the difference between predictions and correct answers into a number. Examples: mean squared error and cross-entropy.&lt;/p&gt;&lt;div class=&quot;label&quot;&gt;Role&lt;/div&gt;&lt;p&gt;Measures how wrong predictions are. Training aims to reduce this value.&lt;/p&gt;&lt;div class=&quot;label&quot;&gt;In the Playground&lt;/div&gt;&lt;p&gt;Training loss and test loss appear at the top right.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;Optimization algorithm&lt;/h3&gt;&lt;div class=&quot;label&quot;&gt;What it is&lt;/div&gt;&lt;p&gt;A method for updating weights to reduce loss. Gradient descent uses gradients computed through backpropagation.&lt;/p&gt;&lt;div class=&quot;label&quot;&gt;Role&lt;/div&gt;&lt;p&gt;Moves weights in a direction that lowers loss. The learning rate controls step size.&lt;/p&gt;&lt;div class=&quot;label&quot;&gt;In the Playground&lt;/div&gt;&lt;p&gt;Adjust the learning rate and regularization (L1 or L2).&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;footer&quot;&gt;&lt;span&gt;Neural Network Components&lt;/span&gt;&lt;span&gt;07 / 10&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;slide&quot;&gt;&lt;h2&gt;How the Pieces Work Together&lt;/h2&gt;&lt;p class=&quot;subtitle&quot;&gt;Training is a repeating cycle of predict, measure, and adjust&lt;/p&gt;&lt;div class=&quot;steps&quot;&gt;&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;number&quot;&gt;1&lt;/span&gt;&lt;strong&gt;Forward pass&lt;/strong&gt;&lt;p&gt;Inputs pass through layers, weights, and activations to make a prediction.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;number&quot;&gt;2&lt;/span&gt;&lt;strong&gt;Compute loss&lt;/strong&gt;&lt;p&gt;Compare the prediction with the correct answer.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;number&quot;&gt;3&lt;/span&gt;&lt;strong&gt;Backpropagation&lt;/strong&gt;&lt;p&gt;Compute how much each weight contributes to the loss.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;number&quot;&gt;4&lt;/span&gt;&lt;strong&gt;Update weights&lt;/strong&gt;&lt;p&gt;The optimizer adjusts weights to reduce loss.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;Repeat:&lt;/strong&gt; Train for many rounds (epochs) until the loss stops improving. TensorFlow Playground visualizes the process.&lt;/div&gt;&lt;div class=&quot;footer&quot;&gt;&lt;span&gt;Neural Network Components&lt;/span&gt;&lt;span&gt;08 / 10&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;slide&quot;&gt;&lt;h2&gt;Playground Experiments&lt;/h2&gt;&lt;p class=&quot;subtitle&quot;&gt;Variables changed and the behavior they reveal&lt;/p&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;What I changed&lt;/th&gt;&lt;th&gt;What it revealed&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Data type&lt;/strong&gt;&lt;br&gt;Circle, XOR, spiral&lt;/td&gt;&lt;td&gt;Simple patterns are solved quickly by small networks; spirals need greater capacity or additional features.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Noise&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;More noise blurs class boundaries and can increase the gap between training and test loss.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Input features&lt;/strong&gt;&lt;br&gt;x₁², x₂², x₁x₂, sin&lt;/td&gt;&lt;td&gt;Engineered features can help small networks solve patterns that raw inputs cannot.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Layers and neurons&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;More capacity learns more complex boundaries but can train more slowly and overfit.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Learning rate&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Too high can make loss oscillate or diverge; too low makes training slow.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;a href=&quot;https://playground.tensorflow.org/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Explore TensorFlow Playground&lt;/a&gt;&lt;/p&gt;&lt;div class=&quot;footer&quot;&gt;&lt;span&gt;Neural Network Components&lt;/span&gt;&lt;span&gt;09 / 10&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;slide&quot;&gt;&lt;h2&gt;Summary&lt;/h2&gt;&lt;p class=&quot;subtitle&quot;&gt;Why visualizing neural networks matters&lt;/p&gt;&lt;div class=&quot;grid two&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;It opens the black box&lt;/h3&gt;&lt;p&gt;Seeing weights, layers, and decision boundaries makes abstract models easier to inspect.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;Nonlinearity is essential&lt;/h3&gt;&lt;p&gt;Activation functions enable networks to learn curves instead of only straight-line relationships.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;It builds intuition&lt;/h3&gt;&lt;p&gt;Changing size, noise, and learning rate reveals important trade-offs.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;Training is a cycle&lt;/h3&gt;&lt;p&gt;Predict, measure the loss, and adjust weights repeatedly.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;It speeds up debugging&lt;/h3&gt;&lt;p&gt;Comparing training and test loss can help identify overfitting.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h3&gt;Bigger is not always better&lt;/h3&gt;&lt;p&gt;Useful features and clean data can matter as much as additional layers or neurons.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;footer&quot;&gt;&lt;span&gt;Neural Network Components&lt;/span&gt;&lt;span&gt;10 / 10&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;&lt;nav class=&quot;controls&quot;&gt;&lt;button id=&quot;prev&quot; type=&quot;button&quot;&gt;← Previous&lt;/button&gt;&lt;span id=&quot;counter&quot; aria-live=&quot;polite&quot;&gt;Slide 1 of 10&lt;/span&gt;&lt;button id=&quot;next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/nav&gt;&lt;script&gt;

&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div class=&quot;container&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Portfolio artifact 03 · Generative AI systems&lt;/div&gt;&lt;h1&gt;From Raw Data to a Deployed Large Language Model&lt;/h1&gt;&lt;p&gt;A visual guide to how LLMs are trained, the infrastructure they require, and the trade-offs behind performance, energy, time, and cost.&lt;/p&gt;&lt;div class=&quot;quicknav&quot;&gt;&lt;a href=&quot;#pipeline&quot;&gt;Training pipeline&lt;/a&gt;&lt;a href=&quot;#resources&quot;&gt;Resource map&lt;/a&gt;&lt;a href=&quot;#examples&quot;&gt;Real models&lt;/a&gt;&lt;a href=&quot;#explanation&quot;&gt;Explanatory document&lt;/a&gt;&lt;a href=&quot;#about&quot;&gt;Portfolio&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;meta&quot;&gt;Shreyas Kotian · AI / ML Professional Portfolio&lt;/div&gt;&lt;/div&gt;&lt;/header&gt;
&lt;main&gt;&lt;section id=&quot;pipeline&quot; class=&quot;container&quot;&gt;&lt;h2&gt;01 / The LLM training lifecycle&lt;/h2&gt;&lt;p class=&quot;intro&quot;&gt;A model is not trained in a single step. Each stage transforms data, improves capabilities, or checks whether the system is safe and useful.&lt;/p&gt;&lt;div class=&quot;flow&quot; aria-label=&quot;Eight stages of training a large language model&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;sym&quot; aria-hidden=&quot;true&quot;&gt;📚&lt;/span&gt;&lt;h3&gt;Collect data&lt;/h3&gt;&lt;p&gt;Gather licensed, public, curated and task-specific text or code with provenance and permission checks.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;sym&quot; aria-hidden=&quot;true&quot;&gt;🧹&lt;/span&gt;&lt;h3&gt;Clean &amp; tokenize&lt;/h3&gt;&lt;p&gt;Deduplicate, filter harmful or low-quality data, balance sources and convert text into tokens.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;sym&quot; aria-hidden=&quot;true&quot;&gt;🏗️&lt;/span&gt;&lt;h3&gt;Design the model&lt;/h3&gt;&lt;p&gt;Choose Transformer architecture, parameter count, context length, optimizer and training plan.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;sym&quot; aria-hidden=&quot;true&quot;&gt;⚡&lt;/span&gt;&lt;h3&gt;Pretrain at scale&lt;/h3&gt;&lt;p&gt;Use distributed GPU/TPU clusters to predict tokens and update billions of weights.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;sym&quot; aria-hidden=&quot;true&quot;&gt;🎯&lt;/span&gt;&lt;h3&gt;Post-train &amp; align&lt;/h3&gt;&lt;p&gt;Instruction-tune and apply preference optimization or human-feedback methods for helpful behavior.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;sym&quot; aria-hidden=&quot;true&quot;&gt;🧪&lt;/span&gt;&lt;h3&gt;Evaluate &amp; red-team&lt;/h3&gt;&lt;p&gt;Test accuracy, robustness, bias, safety, privacy, hallucinations and performance on held-out tasks.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;sym&quot; aria-hidden=&quot;true&quot;&gt;🚀&lt;/span&gt;&lt;h3&gt;Deploy &amp; serve&lt;/h3&gt;&lt;p&gt;Optimize inference, monitor latency and cost, add access controls and deliver through apps or APIs.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;sym&quot; aria-hidden=&quot;true&quot;&gt;🔁&lt;/span&gt;&lt;h3&gt;Monitor &amp; improve&lt;/h3&gt;&lt;p&gt;Track failures and user feedback, refresh evaluations and decide when retraining is justified.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;div class=&quot;callout&quot;&gt;&lt;strong&gt;Important distinction:&lt;/strong&gt; Pretraining builds general language capabilities. Post-training improves instruction-following and alignment. Deployment adds ongoing inference costs that are separate from training costs.&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;resources&quot; class=&quot;container&quot;&gt;&lt;h2&gt;02 / Four resources that shape every training run&lt;/h2&gt;&lt;p class=&quot;intro&quot;&gt;Model quality is not simply a function of size: data quality, compute efficiency, power availability, and elapsed time all matter.&lt;/p&gt;&lt;div class=&quot;resources&quot;&gt;
&lt;div class=&quot;resource&quot;&gt;&lt;div class=&quot;icon&quot; aria-hidden=&quot;true&quot;&gt;🗂️&lt;/div&gt;&lt;h3&gt;Datasets&lt;/h3&gt;&lt;p&gt;Trillions of tokens may be needed. Quality, diversity, deduplication and licensing affect generalization and risk.&lt;/p&gt;&lt;span class=&quot;impact&quot;&gt;Performance: knowledge and coverage&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;resource&quot;&gt;&lt;div class=&quot;icon&quot; aria-hidden=&quot;true&quot;&gt;🖥️&lt;/div&gt;&lt;h3&gt;Compute&lt;/h3&gt;&lt;p&gt;GPU/TPU accelerators, high-bandwidth memory, networking and storage support distributed training.&lt;/p&gt;&lt;span class=&quot;impact&quot;&gt;Cost: accelerators and infrastructure&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;resource&quot;&gt;&lt;div class=&quot;icon&quot; aria-hidden=&quot;true&quot;&gt;🔋&lt;/div&gt;&lt;h3&gt;Energy&lt;/h3&gt;&lt;p&gt;Accelerators, CPUs, networking and cooling consume electricity; efficiency and grid mix affect impact.&lt;/p&gt;&lt;span class=&quot;impact&quot;&gt;Cost: electricity and cooling&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;resource&quot;&gt;&lt;div class=&quot;icon&quot; aria-hidden=&quot;true&quot;&gt;⏱️&lt;/div&gt;&lt;h3&gt;Time&lt;/h3&gt;&lt;p&gt;Experimentation, training, checkpoints, evaluations and post-training extend schedules and staff effort.&lt;/p&gt;&lt;span class=&quot;impact&quot;&gt;Cost: GPU-hours and iteration cycles&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;examples&quot; class=&quot;container&quot;&gt;&lt;h2&gt;03 / Real-world model evidence&lt;/h2&gt;&lt;p class=&quot;intro&quot;&gt;Meta publishes substantial training-resource figures for Llama 3.1. OpenAI's GPT-4 report describes its general approach but does not disclose comparable hardware, energy or cost figures.&lt;/p&gt;&lt;div class=&quot;panel&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Meta Llama 3.1 family · officially reported&lt;/span&gt;&lt;h3&gt;Scale of pretraining&lt;/h3&gt;&lt;div class=&quot;stats&quot;&gt;&lt;div class=&quot;stat&quot;&gt;&lt;strong&gt;~15T&lt;/strong&gt;&lt;small&gt;pretraining tokens (family)&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;strong&gt;39.3M&lt;/strong&gt;&lt;small&gt;cumulative H100 GPU-hours (8B + 70B + 405B)&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;strong&gt;11,390 t&lt;/strong&gt;&lt;small&gt;location-based CO₂e estimate (family)&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3 style=&quot;margin-top:26px&quot;&gt;GPU-hours by Llama 3.1 model&lt;/h3&gt;&lt;div class=&quot;bars&quot; role=&quot;img&quot; aria-label=&quot;Llama 3.1 GPU hours: 8 billion model 1.46 million, 70 billion model 7 million, 405 billion model 30.84 million&quot;&gt;&lt;div class=&quot;barline&quot;&gt;&lt;b&gt;8B&lt;/b&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill&quot; style=&quot;width:4.7%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span&gt;1.46M&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;barline&quot;&gt;&lt;b&gt;70B&lt;/b&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill&quot; style=&quot;width:22.7%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span&gt;7.00M&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;barline&quot;&gt;&lt;b&gt;405B&lt;/b&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill&quot; style=&quot;width:100%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span&gt;30.84M&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;font-size:.84rem;color:#5d6d80;margin-top:15px&quot;&gt;The bars compare cumulative GPU-hours, not elapsed calendar days. Meta reports 700 W as the H100 hardware power figure in its model card; that is not a measurement of the entire facility's electricity use.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;modelgrid&quot; style=&quot;margin-top:16px&quot;&gt;&lt;div class=&quot;model&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Llama 3.1 405B · reported&lt;/span&gt;&lt;h3&gt;Large open-weight model&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;405 billion parameters&lt;/strong&gt; and part of a family pretrained on approximately 15 trillion tokens.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;30.84 million H100 GPU-hours&lt;/strong&gt; reported for its training.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;8,930 tonnes CO₂e&lt;/strong&gt; estimated on a location-based basis.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Actual dollar training cost:&lt;/strong&gt; not published as an audited total.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;model&quot;&gt;&lt;span class=&quot;tag gray&quot;&gt;GPT-4 · limited disclosure&lt;/span&gt;&lt;h3&gt;Proprietary model&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;OpenAI reports Transformer-style next-token pretraining and reinforcement learning from human feedback.&lt;/li&gt;&lt;li&gt;Exact dataset composition, parameter count, hardware, GPU-hours and energy are &lt;strong&gt;not disclosed&lt;/strong&gt; in its technical report.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Actual dollar training cost:&lt;/strong&gt; not publicly verified in that report.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;strong&gt;Illustrative compute-rental scenario — not Meta's actual bill&lt;/strong&gt;&lt;code&gt;30.84 million GPU-hours × $2–$5 / GPU-hour = $61.7M–$154.2M&lt;/code&gt;&lt;p&gt;Assumed rental prices are examples, not historical quotations. This hypothetical GPU rental component excludes networking, storage, data, staff, failed experiments, evaluation and deployment; owned hardware economics differ. It should not be presented as a verified Llama 3.1 training cost.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;explanation&quot; class=&quot;container&quot;&gt;&lt;h2&gt;04 / Explanatory document&lt;/h2&gt;&lt;p class=&quot;intro&quot;&gt;A concise explanation of the graphic's main points, key considerations and design decisions.&lt;/p&gt;&lt;div class=&quot;panel prose&quot;&gt;&lt;h3&gt;Purpose and central message&lt;/h3&gt;&lt;p&gt;This infographic explains how generative large language models progress from raw training material to an operational system. Its central argument is that model performance emerges from an entire pipeline—not simply from increasing parameter count. Curated data, scalable hardware, carefully managed optimization, post-training, evaluation and ongoing deployment are interconnected investments.&lt;/p&gt;&lt;h3&gt;Training and infrastructure considerations&lt;/h3&gt;&lt;p&gt;The eight-stage pipeline distinguishes data preparation, architecture selection, pretraining, post-training, evaluation and deployment. Datasets shape coverage and bias; accelerators and interconnects determine feasible model scale; energy and cooling impose operational and environmental constraints; and training time affects experimentation and budgets. Compute is often expressed in GPU-hours, which combines the number of accelerators with the time each runs. This is not the same as wall-clock duration.&lt;/p&gt;&lt;h3&gt;Comparing actual models responsibly&lt;/h3&gt;&lt;p&gt;The Llama 3.1 example uses Meta's published figures: approximately 15 trillion pretraining tokens across the family and 39.3 million cumulative H100 GPU-hours across three model sizes. The GPT-4 example highlights a disclosure limitation: OpenAI describes pretraining and RLHF, but does not publish the specific compute, hardware, energy or total cost figures in its technical report. The rental-cost calculation is explicitly hypothetical, demonstrating how pricing assumptions affect budgets without falsely implying an audited cost.&lt;/p&gt;&lt;h3&gt;Design rationale and accessibility&lt;/h3&gt;&lt;p&gt;Numbered cards establish the sequence of training, four resource cards isolate the major infrastructure demands, and horizontal bars compare GPU-hours without requiring specialist knowledge. High-contrast typography, descriptive labels, responsive layouts, a text description of the chart and linked primary sources support accessibility. The portfolio framing connects this artifact to systems thinking, AI infrastructure literacy and responsible interpretation of evidence.&lt;/p&gt;&lt;h3&gt;Key takeaway&lt;/h3&gt;&lt;p&gt;Effective LLM development requires balancing model capability with data quality, hardware utilization, energy, safety and transparent cost accounting. Larger training budgets can enable stronger models, but they do not eliminate the need for thoughtful data governance, rigorous evaluation or responsible deployment.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;about&quot; class=&quot;container&quot;&gt;&lt;h2&gt;05 / About me &amp; portfolio skills&lt;/h2&gt;&lt;div class=&quot;portfolio&quot;&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;About me&lt;/h3&gt;&lt;p&gt;I am an engineering and AI/ML practitioner interested in connecting rigorous modeling, data-driven analysis and practical machine learning systems. My experience with simulation, technical research and quantitative problem-solving informs my goal of developing reliable, transparent AI solutions.&lt;/p&gt;&lt;h3&gt;Work samples&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Assignment 1:&lt;/strong&gt; A visual framework comparing machine-learning algorithms and application domains. &lt;strong&gt;Assignment 2:&lt;/strong&gt; An interactive explanation of neural network components and training. &lt;strong&gt;Assignment 3:&lt;/strong&gt; An evidence-based infographic connecting LLM training stages to infrastructure, environmental considerations and costs.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Skills &amp; technologies&lt;/h3&gt;&lt;div class=&quot;skills&quot;&gt;&lt;span class=&quot;skill&quot;&gt;Machine learning&lt;/span&gt;&lt;span class=&quot;skill&quot;&gt;Neural networks&lt;/span&gt;&lt;span class=&quot;skill&quot;&gt;Generative AI&lt;/span&gt;&lt;span class=&quot;skill&quot;&gt;Data analysis&lt;/span&gt;&lt;span class=&quot;skill&quot;&gt;Python&lt;/span&gt;&lt;span class=&quot;skill&quot;&gt;CFD / simulation&lt;/span&gt;&lt;span class=&quot;skill&quot;&gt;Technical research&lt;/span&gt;&lt;span class=&quot;skill&quot;&gt;Visualization&lt;/span&gt;&lt;span class=&quot;skill&quot;&gt;Responsible AI&lt;/span&gt;&lt;span class=&quot;skill&quot;&gt;HTML / CSS&lt;/span&gt;&lt;/div&gt;&lt;p style=&quot;font-size:.86rem;color:#617187;margin-top:18px&quot;&gt;Portfolio emphasis: explaining technical systems clearly, evaluating evidence, and communicating trade-offs to varied audiences.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;container&quot; id=&quot;sources&quot;&gt;&lt;h2&gt;Sources and evidence&lt;/h2&gt;&lt;div class=&quot;panel&quot;&gt;&lt;ol class=&quot;sources&quot;&gt;&lt;li&gt;Meta, &lt;a href=&quot;https://github.com/meta-llama/llama-models/blob/main/models/llama3_1/MODEL_CARD.md&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Llama 3.1 Model Card&lt;/a&gt; — token count, H100 GPU-hours, power figures and emissions.&lt;/li&gt;&lt;li&gt;OpenAI, &lt;a href=&quot;https://cdn.openai.com/papers/gpt-4.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;GPT-4 Technical Report&lt;/a&gt; — training approach and limits of public disclosure.&lt;/li&gt;&lt;li&gt;Stanford CRFM, &lt;a href=&quot;https://crfm.stanford.edu/fmti/May-2024/company-reports/OpenAI_GPT-4.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Foundation Model Transparency Index: GPT-4&lt;/a&gt; — independent review of disclosed training resources.&lt;/li&gt;&lt;/ol&gt;&lt;p style=&quot;font-size:.83rem;color:#617187&quot;&gt;Resource and model examples are based on publicly documented information; actual provider expenditures are not inferred from speculative estimates.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;/main&gt;&lt;footer&gt;Assignment 3 · Training Generative AI Large Language Models · Shreyas Kotian&lt;/footer&gt;&lt;/body&gt;&lt;/html&gt;" title="Assignment 3: How Generative AI LLMs Are Trained"></iframe></div>
